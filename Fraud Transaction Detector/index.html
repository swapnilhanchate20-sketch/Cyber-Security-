<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraud Transaction Detector</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Fraud Transaction Detector</h1>
            <p>Cyber Fraud Investigation Tool</p>
        </header>

        <main>

            <section class="card">
                <h2>Transaction Analysis</h2>

                <form id="transactionForm">

                    <label for="amount">Transaction Amount (₹)</label>
                    <input type="number" id="amount" placeholder="Enter amount" required>

                    <label for="location">Transaction Location</label>
                    <input type="text" id="location" placeholder="e.g. Mumbai" required>

                    <label for="previousLocation">Previous Transaction Location</label>
                    <input type="text" id="previousLocation" placeholder="e.g. Delhi" required>

                    <label for="transactionTime">Transaction Time</label>
                    <input type="time" id="transactionTime" required>

                    <label for="newDevice">New Device Used?</label>
                    <select id="newDevice" required>
                        <option value="">Select</option>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>

                    <label for="international">International Transaction?</label>
                    <select id="international" required>
                        <option value="">Select</option>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>

                    <button type="submit">Analyze Transaction</button>

                </form>
            </section>

            <section class="card result-card" id="result">
                <h2>Investigation Result</h2>

                <div id="riskLevel">
                    <p>Enter transaction details and click "Analyze Transaction".</p>
                </div>

                <div id="riskScore"></div>

                <div id="reasons"></div>
            </section>

        </main>

        <footer>
            <p>Fraud Transaction Detector | Cybersecurity Portfolio Project</p>
        </footer>

    </div>

    <script src="scripts/script.js"></script>

</body>
</html>
