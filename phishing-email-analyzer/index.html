<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles/style.css">
    <title>Phishing Email Analyzer</title>
</head>

<body>

    <header>
        <h1>Phishing Email Analyzer</h1>
        <p>Analyze an email for common phishing indicators.</p>
    </header>

    <main>

        <section>
            <h2>Analyze Email</h2>

            <label for="sender">Sender Email:</label>
            <br>
            <input
                type="email"
                id="sender"
                placeholder="example@email.com"
            >

            <br><br>

            <label for="subject">Email Subject:</label>
            <br>
            <input
                type="text"
                id="subject"
                placeholder="Enter email subject"
            >

            <br><br>

            <label for="email">Email Content:</label>
            <br>
            <textarea
                id="email"
                rows="12"
                cols="50"
                placeholder="Paste the email content here..."
            ></textarea>

            <br><br>

            <button id="analyzeButton">Analyze Email</button>
        </section>

        <section>
            <h2>Analysis Result</h2>

            <div id="result">
                <p>Analysis results will appear here.</p>
            </div>
        </section>

    </main>

  <script src="scripts/script.js"></script>
  
</body>
</html>
